<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schede valutazione PM — Area riservata</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:#0f172a; color:#e2e8f0; padding:24px; }
  .card { width:100%; max-width:360px; background:#1e293b; border:1px solid #334155;
          border-radius:14px; padding:28px; box-shadow:0 10px 40px rgba(0,0,0,.35); }
  .lock { font-size:1.6rem; line-height:1; }
  h1 { font-size:1.1rem; margin:10px 0 4px; }
  p.sub { margin:0 0 20px; font-size:.85rem; color:#94a3b8; }
  label { display:block; font-size:.8rem; margin-bottom:6px; color:#cbd5e1; }
  input { width:100%; padding:11px 12px; border-radius:9px; border:1px solid #475569;
          background:#0f172a; color:#e2e8f0; font-size:1rem; }
  input:focus { outline:none; border-color:#6366f1; }
  button { width:100%; margin-top:14px; padding:11px; border:0; border-radius:9px;
           background:#6366f1; color:#fff; font-size:.95rem; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .err { margin-top:12px; font-size:.82rem; color:#f87171; min-height:1.1em; }
</style>
</head>
<body>
  <form class="card" id="gate" autocomplete="off">
    <div class="lock">🔒</div>
    <h1>Area riservata</h1>
    <p class="sub">Schede di valutazione PM. Inserisci la password per accedere.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required>
    <button type="submit" id="go">Sblocca</button>
    <div class="err" id="err" role="alert"></div>
  </form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw, salt, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base,
    {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function unlock(pw){
  const key = await deriveKey(pw, b64(PAYLOAD.salt), PAYLOAD.iter);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return new TextDecoder().decode(buf);
}
const form = document.getElementById('gate');
const err = document.getElementById('err');
const go = document.getElementById('go');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.textContent = '';
  go.disabled = true; go.textContent = 'Verifico…';
  try {
    const html = await unlock(document.getElementById('pw').value);
    document.open(); document.write(html); document.close();
  } catch (_) {
    err.textContent = 'Password errata.';
    go.disabled = false; go.textContent = 'Sblocca';
    const i = document.getElementById('pw'); i.select(); i.focus();
  }
});
</script>
